version: "3.9"

services:
  surefinance-mcp:
    build: .
    ports:
      - "4332:3500"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: 3500
      MCP_SERVER_ENV: development
      LOG_LEVEL: debug
      LOG_FORMAT: text
    networks:
      - sure-finance_sure_net
      - default


networks:
  sure-finance_sure_net:
    external: true
