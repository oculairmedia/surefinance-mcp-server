version: "3.9"

services:
  surefinance-mcp:
    build: .
    ports:
      - "4332:3500"
    env_file:
      - .env
    environment:
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: 3500
      MCP_SERVER_ENV: development
      LOG_LEVEL: info
      LOG_FORMAT: json
    networks:
      - sure-finance_sure_net
      - default


networks:
  sure-finance_sure_net:
    external: true
