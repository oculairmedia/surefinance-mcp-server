version: "3.9"

services:
  surefinance-mcp:
    build: .
    ports:
      - "3500:3500"
    environment:
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: 3500
      MCP_SERVER_ENV: development
      LOG_LEVEL: info
      LOG_FORMAT: json
      DATABASE_URL: ${DATABASE_URL}
      API_KEY: ${API_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: surefinance
      POSTGRES_PASSWORD: password
      POSTGRES_DB: surefinance_development
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
